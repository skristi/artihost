<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where to stay in Panevėžys</title>
<meta name="description" content="Staying in Panevėžys, Lithuania? Our pick: Artihost, an art &amp; culture hostel in the city centre.">
<link rel="canonical" href="https://skristi.github.io/artihost/">
<meta property="og:type" content="website">
<meta property="og:title" content="Where to stay in Panevėžys">
<meta property="og:description" content="Our pick: Artihost, an art &amp; culture hostel in the city centre.">
<meta property="og:image" content="https://artihost.eu/wp-content/uploads/2022/09/Front@0.5x-1024x768-optimized.jpg">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#141714;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.stage{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.15) 55%,rgba(0,0,0,.25))}
.copy{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto;padding:0 24px 12vh}
p{margin:0 0 12px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
h1{margin:0 0 36px;font-size:clamp(56px,12vw,168px);font-weight:700;line-height:.9;letter-spacing:-.02em}
a{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:14px 30px;border-radius:999px;background:#fff;color:#141714;font-size:18px;font-weight:600;text-decoration:none}
a:hover{background:#e6efe9}
a:focus-visible{outline:3px solid #f2a33a;outline-offset:3px}
</style>
</head>
<body>
<main class="stage">
  <!-- Large-format media: put hero.mp4 (and optionally a bigger photo as the poster) in this repo. Until hero.mp4 exists, the poster photo is shown. -->
  <video autoplay muted loop playsinline aria-hidden="true" poster="https://artihost.eu/wp-content/uploads/2022/09/Front@0.5x-1024x768-optimized.jpg">
    <source src="hero.mp4" type="video/mp4">
  </video>
  <div class="copy">
    <p>Where to stay in</p>
    <h1>Panevėžys</h1>
    <a href="https://artihost.eu/our-rooms">Artihost – rooms from €14
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
</main>
<script>
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var v = document.querySelector('video'); v.removeAttribute('autoplay'); v.pause();
  }
</script>
</body>
</html>
